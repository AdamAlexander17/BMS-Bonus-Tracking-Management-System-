<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="bg-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8dff"/>
      <stop offset="100%" stop-color="#1742b5"/>
    </linearGradient>
    <linearGradient id="bg-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#9aa0a6"/>
    </linearGradient>
    <linearGradient id="bg-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb13a"/>
      <stop offset="100%" stop-color="#e07b00"/>
    </linearGradient>
    <linearGradient id="bg-swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb13a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffb13a" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Letters -->
  <g font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="84" text-anchor="middle">
    <text x="38"  y="78" fill="url(#bg-b)">B</text>
    <text x="100" y="78" fill="url(#bg-m)">M</text>
    <text x="162" y="78" fill="url(#bg-s)">S</text>
  </g>
  <!-- Orange swoosh under the letters -->
  <path d="M14 90 C 70 110, 140 110, 190 84"
        stroke="url(#bg-swoosh)" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
